const data=[['vase','花瓶',8,38,17,13,8,66],['mug','马克杯',27,39,16,12,27,74],['football','足球',44,39,16,12,45,64],['clock','闹钟',63,39.85,16,10.3,60,73],['penholder','笔筒',79,38,16,13,67,66]];

function after(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id}

function updateClock(){elapsedMs=performance.now()-startedAt;clock.textContent='用时 '+formatTime(elapsedMs)}

function drop(){if(!active)return;const options=data.filter(d=>state[d[0]].status==='desk');if(options.length<=1)return;const d=options[Math.floor(Math.random()*options.length)],key=d[0],s=state[key],el=s.el;hasDropped=true;s.status='falling';const reaction=++reactionSeq;scene.src=IMAGES[expressions[reactionIndex++%expressions.length]];after(()=>{if(active&&reaction===reactionSeq)scene.src=IMAGES.scene},450);const pace=config.phases[phase],duration=pace.fallMin+Math.random()*(pace.fallMax-pace.fallMin),[w,h,oldH]=fallBoxes[key];el.classList.add('falling');el.style.transition='none';const jitter=Math.random()*3-1.5,x=Math.max(4,Math.min(77,s.goal[0]+jitter)),y=s.goal[1]+jitter+(oldH-h)/2;s.target=[x,y,w,h];requestAnimationFrame(()=>requestAnimationFrame(()=>{if(s.status!=='falling')return;el.style.transition=`left ${duration}ms cubic-bezier(.28,.5,.65,1),top ${duration}ms cubic-bezier(.32,.05,.7,1)`;place(el,x,y,s.home[2],s.home[3])}));after(()=>{if(s.status==='falling'){s.status='dropped';el.querySelector('img').src=IMAGES[key+'_fallen'];el.classList.remove('falling');el.classList.add('dropped');el.style.transition='none';place(el,x,y,w,h)}},duration+30)}
