const game=document.getElementById('game'),scene=document.getElementById('scene'),layer=document.getElementById('pieces'),win=document.getElementById('win'),clock=document.getElementById('clock'),resultTime=document.getElementById('resultTime');
scene.src=IMAGES.scene;document.getElementById('intro').src=IMAGES.intro;document.getElementById('introItem').src=IMAGES.clock_normal;
const config={phases:[{duration:4000,min:260,max:380,fallMin:110,fallMax:155},{duration:4000,min:1100,max:1600,fallMin:310,fallMax:420},{duration:4000,min:210,max:320,fallMin:100,fallMax:145}],returnMs:200};
const data=[['vase','花瓶',8,38,17,13,8,66],['mug','马克杯',27,39,16,12,27,74],['football','足球',44,39,16,12,45,64],['clock','闹钟',62,40.5,18,12,61,73],['penholder','笔筒',79,38,16,13,67,66]];
const expressions=['scene_glance','scene_determined','scene_curious'];

let state={},active=false,paused=false,hasDropped=false,phase=0,epoch=0,timers=[],reactionIndex=0,reactionSeq=0,startedAt=0,elapsedMs=0,clockTimer=null;
function after(fn,ms){const id=setTimeout(fn,ms);timers.push(id);return id}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function formatTime(ms){const seconds=Math.floor(ms/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function updateClock(){elapsedMs=performance.now()-startedAt;clock.textContent='用时 '+formatTime(elapsedMs)}
function place(el,x,y,w,h){el.style.left=x+'%';el.style.top=y+'%';el.style.width=w+'%';el.style.height=h+'%'}
function reset(){paused=false;game.classList.remove('paused');epoch++;reactionSeq++;reactionIndex=0;clearTimers();clearInterval(clockTimer);clockTimer=null;active=false;hasDropped=false;phase=0;elapsedMs=0;clock.textContent='用时 00:00';clock.hidden=true;win.classList.remove('show');game.classList.remove('playing','tutorial');scene.src=IMAGES.scene;layer.innerHTML='';state={};for(const [key,label,x,y,w,h,gx,gy] of data){const el=document.createElement('button');el.type='button';el.className='piece';el.setAttribute('aria-label',label);const img=document.createElement('img');img.src=IMAGES[key+'_normal'];img.alt='';el.append(img);place(el,x,y,w,h);el.onclick=()=>restore(key);layer.append(el);state[key]={status:'desk',el,home:[x,y,w,h],goal:[gx,gy]}}}

function changePhase(){if(!active)return;phase=(phase+1)%3;after(changePhase,config.phases[phase].duration)}
function loop(){if(!active)return;drop();const p=config.phases[phase];after(loop,p.min+Math.random()*(p.max-p.min))}
function drop(){if(!active)return;const options=data.filter(d=>state[d[0]].status==='desk');if(options.length<=1)return;const d=options[Math.floor(Math.random()*options.length)],key=d[0],s=state[key],el=s.el;hasDropped=true;s.status='falling';const reaction=++reactionSeq;scene.src=IMAGES[expressions[reactionIndex++%expressions.length]];after(()=>{if(active&&reaction===reactionSeq)scene.src=IMAGES.scene},450);const pace=config.phases[phase],duration=pace.fallMin+Math.random()*(pace.fallMax-pace.fallMin),[w,h,oldH]=fallBoxes[key];el.classList.add('falling');el.style.transition='none';const jitter=Math.random()*3-1.5,x=Math.max(4,Math.min(77,s.goal[0]+jitter)),y=s.goal[1]+jitter+(oldH-h)/2;s.target=[x,y,w,h];requestAnimationFrame(()=>requestAnimationFrame(()=>{if(s.status!=='falling')return;el.style.transition=`left ${duration}ms cubic-bezier(.28,.5,.65,1),top ${duration}ms cubic-bezier(.32,.05,.7,1)`;place(el,x,y,s.home[2],s.home[3])}));after(()=>{if(s.status==='falling'){s.status='dropped';el.querySelector('img').src=IMAGES[key+'_fallen'];el.classList.remove('falling');el.classList.add('dropped');el.style.transition='none';place(el,x,y,w,h)}},duration+30)}
function finish(){paused=false;game.classList.remove('paused');active=false;clearTimers();clearInterval(clockTimer);clockTimer=null;updateClock();clock.hidden=true;resultTime.textContent='本局用时 '+formatTime(elapsedMs);scene.src=IMAGES.scene;win.classList.add('show')}
function restore(key){if(!active)return;const s=state[key];if(!s||s.status!=='dropped')return;s.status='returning';const el=s.el;el.classList.remove('dropped');el.classList.add('recovering');el.style.transition=`left ${config.returnMs}ms ease-out,top ${config.returnMs}ms ease-out`;place(el,s.home[0],s.home[1],s.target[2],s.target[3]);after(()=>{if(s.status!=='returning')return;el.querySelector('img').src=IMAGES[key+'_normal'];place(el,...s.home);el.style.transition='none';el.classList.remove('recovering');s.status='desk';if(hasDropped&&Object.values(state).every(v=>v.status==='desk'))finish()},config.returnMs)}
function pauseGame(){if(!active)return;updateClock();active=false;paused=true;clearTimers();clearInterval(clockTimer);clockTimer=null;scene.src=IMAGES.scene;for(const [key,s] of Object.entries(state)){const el=s.el;if(s.status==='falling'){s.status='dropped';el.querySelector('img').src=IMAGES[key+'_fallen'];el.classList.remove('falling');el.classList.add('dropped');el.style.transition='none';place(el,...s.target)}else if(s.status==='returning'){s.status='desk';el.querySelector('img').src=IMAGES[key+'_normal'];el.classList.remove('recovering');el.style.transition='none';place(el,...s.home)}}game.classList.add('paused')}
function resumeGame(){if(!paused)return;paused=false;game.classList.remove('paused');startedAt=performance.now()-elapsedMs;if(hasDropped&&Object.values(state).every(v=>v.status==='desk')){finish();return}active=true;clockTimer=setInterval(updateClock,100);after(loop,220);after(changePhase,config.phases[phase].duration)}
document.getElementById('pauseButton').onclick=pauseGame;document.getElementById('resumeButton').onclick=resumeGame;document.getElementById('quitButton').onclick=reset;
document.getElementById('start').onclick=showTutorial;document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('back').onclick=reset;reset();
